<style>
/* Layout: one-screen phone app — drill-down Точка → Покупатель → Покупки, fixed bottom tab bar, bottom sheets for forms */
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --ink:#18221D; --muted:#5E6B64; --line:#D6DDD7;
  --accent:#0E7A5C; --accent-ink:#FFFFFF; --mark:#FFD84D; --danger:#C2412D;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814; --surface:#1A231E; --ink:#E8EEE9; --muted:#97A39C; --line:#2C3832;
  --accent:#3CC598; --accent-ink:#0B1410; --mark:#E6C33A; --danger:#F07A63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#1A231E; --ink:#E8EEE9; --muted:#97A39C; --line:#2C3832;
  --accent:#3CC598; --accent-ink:#0B1410; --mark:#E6C33A; --danger:#F07A63; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
.view{display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
header > div{min-width:0}
h1{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;font-size:14px;align-self:flex-start}
.daybar{display:flex;align-items:center;gap:8px;flex:none}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.iconbtn:disabled{opacity:.4}
.summary{display:flex;gap:10px}
.stat{flex:1;min-width:0;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.stat span{font-size:12px;opacity:.75}
.stat.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
button.row:active{background:var(--bg)}
.avatar{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;background:var(--bg);color:var(--ink)}
.avatar.pt{background:var(--accent);color:var(--accent-ink)}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-size:16px;color:var(--muted);overflow:hidden}
.info{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.amt{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.amt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.chev{color:var(--muted);font-size:18px}
.qty{font-family:var(--f-mono);font-weight:700;background:var(--mark);color:#18221D;border-radius:6px;padding:0 6px}
.del{border:0;background:none;color:var(--muted);font-size:13px;padding:6px;flex:none}
.del.armed{color:var(--danger);font-weight:600}
.group{display:flex;flex-direction:column;gap:8px}
.group h3{margin:0;font-size:13px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.group h3 span:last-child{font-family:var(--f-mono);color:var(--ink)}
.empty{text-align:center;padding:28px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.card .ph{aspect-ratio:1/1;width:100%;max-width:100%;object-fit:cover;background:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-size:34px;color:var(--muted)}
.card .cap{padding:10px 12px;min-width:0}
.card .cat{font-size:12px;color:var(--muted)}
.card .price{font-family:var(--f-mono);font-size:13px;font-weight:700;margin-top:2px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);width:100%;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.tabbar .wrap{max-width:560px;width:100%;display:flex;gap:6px}
.tab{flex:1;border:0;background:none;padding:10px 4px;border-radius:12px;font-weight:600;color:var(--muted);font-size:14px}
.tab[aria-selected="true"]{color:var(--ink);background:var(--bg)}
.scrim{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--f-display);font-weight:500;font-size:18px;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);width:100%;min-width:0}
textarea.input{min-height:64px;resize:vertical}
.photo-pick{border:1.5px dashed var(--line);border-radius:16px;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;color:var(--muted);background:var(--bg);overflow:hidden;padding:0;width:100%}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:24px;font-weight:600;flex:none}
.stepper input{flex:1;text-align:center;font-family:var(--f-mono);font-size:24px;font-weight:700;border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--bg);min-width:0}
.mono{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 14px;border-radius:14px;background:var(--mark);color:#18221D}
.total b{font-family:var(--f-mono);font-size:24px}
.prodhead{display:flex;gap:12px;align-items:center}
.prodhead .thumb{width:60px;height:60px}
.rowline{display:flex;gap:10px}
.rowline > *{flex:1;min-width:0}
.pick{display:flex;flex-direction:column;max-height:50vh;overflow-y:auto;border:1px solid var(--line);border-radius:14px}
.link{border:0;background:none;color:var(--danger);font-size:14px;padding:4px;align-self:center}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;font-weight:500;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="app" id="app"><div id="view"></div></div>

<nav class="tabbar"><div class="wrap">
  <button class="tab" data-tab="points">Точки</button>
  <button class="tab" data-tab="sales">Продажи</button>
  <button class="tab" data-tab="products">Товары</button>
</div></nav>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const CUR="смн";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dayKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dayKey(new Date());
const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const money=n=>{const v=Math.round((Number(n)||0)*100)/100;return v.toLocaleString("ru-RU",{maximumFractionDigits:2})+" "+CUR};
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:NaN};
const byName=(a,b)=>(a.name||"").localeCompare(b.name||"","ru");
const initial=s=>esc((s||"?").trim().charAt(0).toUpperCase()||"?");

const state={points:[],customers:[],products:[],categories:[],sales:[],
  tab:"points",pointId:null,customerId:null,day:new Date(),cat:"all",user:null,loading:true};

/* ---------- storage: Supabase ---------- */
const COLS=["points","customers","products","categories","sales"];
const configured=!/ВСТАВЬТЕ/.test(SUPABASE_URL+SUPABASE_ANON_KEY);
const sb=configured&&window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
const toSnake=k=>k.replace(/[A-Z]/g,m=>"_"+m.toLowerCase());
const toCamel=k=>k.replace(/_([a-z])/g,(_,m)=>m.toUpperCase());
const toDb=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[toSnake(k),v]));
const fromDb=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[toCamel(k),v]));
async function loadAll(){
  const res=await Promise.all(COLS.map(c=>sb.from(c).select("*")));
  res.forEach((r,i)=>{if(r.error)throw r.error;state[COLS[i]]=r.data.map(fromDb)});
  render();
}
async function add(c,data){
  delete data.createdAt;
  const {data:row,error}=await sb.from(c).insert(toDb(data)).select().single();
  if(error)throw error;state[c].push(fromDb(row));render();return row.id;
}
async function patch(c,id,data){
  const {data:row,error}=await sb.from(c).update(toDb(data)).eq("id",id).select().single();
  if(error)throw error;state[c]=state[c].map(r=>r.id===id?fromDb(row):r);render();
}
async function remove(c,id){
  const {error}=await sb.from(c).delete().eq("id",id);
  if(error)throw error;state[c]=state[c].filter(r=>r.id!==id);
  if(c==="points")state.customers=state.customers.filter(x=>x.pointId!==id);
  render();
}

/* ---------- helpers ---------- */
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
function photoSrc(p){return p&&p.photoData||""}
function thumb(p,cls){const src=photoSrc(p);
  return src?`<img class="${cls}" src="${esc(src)}" alt="">`:`<div class="${cls}">${initial(p&&p.name)}</div>`}
function resize(file,max,q){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);c.toBlob(b=>b?res({blob:b,dataUrl:c.toDataURL("image/jpeg",q)}):rej(),"image/jpeg",q)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
function dayTitle(d){const y=new Date();y.setDate(y.getDate()-1);
  const k=dayKey(d);const base=d.getDate()+" "+MONTHS[d.getMonth()];
  return k===today()?"Сегодня, "+base:k===dayKey(y)?"Вчера, "+base:base+(d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():"")}
const saleSum=s=>Number(s.sum)||0;
const totals=list=>({sum:list.reduce((n,s)=>n+saleSum(s),0),qty:list.reduce((n,s)=>n+(Number(s.qty)||0),0)});
const timeOf=s=>{if(!s.ts)return "";const t=new Date(s.ts);return pad(t.getHours())+":"+pad(t.getMinutes())};
function armDelete(btn,label,action){
  if(!btn.classList.contains("armed")){btn.classList.add("armed");const old=btn.textContent;btn.textContent=label;
    setTimeout(()=>{if(btn.isConnected){btn.classList.remove("armed");btn.textContent=old}},3000);return}
  action();
}
const todaySales=()=>state.sales.filter(s=>s.date===today());

/* ---------- views ---------- */
function vPoints(){
  const ts=todaySales();const t=totals(ts);
  const pts=[...state.points].sort(byName);
  return `<div class="view">
    <header><div><div class="eyebrow">${esc(dayTitle(new Date()))}</div><h1>Выберите точку</h1></div></header>
    <div class="summary"><div class="stat"><b>${money(t.sum)}</b><span>выручка сегодня</span></div>
      <div class="stat alt"><b>${ts.length}</b><span>покупок</span></div></div>
    ${pts.length?`<div class="list">${pts.map(p=>{const ps=ts.filter(s=>s.pointId===p.id);const n=state.customers.filter(c=>c.pointId===p.id).length;
      return `<button class="row" data-point="${esc(p.id)}"><div class="avatar pt">${initial(p.name)}</div>
      <div class="info"><div class="name">${esc(p.name)}</div><div class="meta">${n} покуп.${p.address?" · "+esc(p.address):""}</div></div>
      <div class="amt">${ps.length?money(totals(ps).sum):""}${ps.length?`<small>сегодня</small>`:""}</div><span class="chev">›</span></button>`}).join("")}</div>`
    :`<div class="empty"><strong>Точек пока нет</strong>Создайте первую точку: рынок, магазин или район, где у вас покупатели.</div>`}
    <button class="btn" id="addPoint">+ Новая точка</button>
  </div>`;
}
function vPoint(){
  const p=state.points.find(x=>x.id===state.pointId);if(!p){state.pointId=null;return vPoints()}
  const ts=todaySales().filter(s=>s.pointId===p.id);const t=totals(ts);
  const cs=state.customers.filter(c=>c.pointId===p.id).sort(byName);
  return `<div class="view">
    <button class="back" data-go="points">‹ Все точки</button>
    <header><div><div class="eyebrow">Точка${p.address?" · "+esc(p.address):""}</div><h1>${esc(p.name)}</h1></div></header>
    <div class="summary"><div class="stat"><b>${money(t.sum)}</b><span>сегодня по точке</span></div>
      <div class="stat alt"><b>${ts.length}</b><span>покупок</span></div></div>
    <div class="eyebrow">Покупатели</div>
    ${cs.length?`<div class="list">${cs.map(c=>{const s=ts.filter(x=>x.customerId===c.id);
      return `<button class="row" data-customer="${esc(c.id)}"><div class="avatar">${initial(c.name)}</div>
      <div class="info"><div class="name">${esc(c.name)}</div><div class="meta">${c.phone?esc(c.phone):"&nbsp;"}</div></div>
      <div class="amt">${s.length?money(totals(s).sum)+`<small>${s.length} покуп.</small>`:""}</div><span class="chev">›</span></button>`}).join("")}</div>`
    :`<div class="empty"><strong>В этой точке пока нет покупателей</strong>Добавьте покупателя кнопкой ниже.</div>`}
    <button class="btn" id="addCustomer">+ Новый покупатель</button>
    <button class="link" id="delPoint">Удалить точку</button>
  </div>`;
}
function vCustomer(){
  const c=state.customers.find(x=>x.id===state.customerId);if(!c){state.customerId=null;return vPoint()}
  const p=state.points.find(x=>x.id===c.pointId)||{name:""};
  const ts=todaySales().filter(s=>s.customerId===c.id).sort((a,b)=>(b.ts||0)-(a.ts||0));const t=totals(ts);
  return `<div class="view">
    <button class="back" data-go="point">‹ ${esc(p.name)}</button>
    <header><div><div class="eyebrow">Покупатель${c.phone?" · "+esc(c.phone):""}</div><h1>${esc(c.name)}</h1></div></header>
    <div class="total"><span>Взял сегодня на сумму</span><b>${money(t.sum)}</b></div>
    <button class="btn" id="addSale">+ Добавить покупку</button>
    ${ts.length?`<div class="list">${ts.map(s=>saleRow(s,false)).join("")}</div>`
      :`<div class="empty"><strong>Сегодня покупок нет</strong>Нажмите «Добавить покупку» и выберите товар.</div>`}
    <button class="link" id="delCustomer">Удалить покупателя</button>
  </div>`;
}
function saleRow(s,showWho){
  const p=state.products.find(x=>x.id===s.productId)||{name:s.productName};
  const meta=[timeOf(s),showWho?esc(s.customerName):"",`<span class="qty">×${esc(s.qty)}</span>${s.price?" по "+money(s.price):""}`,s.comment?esc(s.comment):""].filter(Boolean).join(" · ");
  return `<div class="row">${thumb(p,"thumb")}<div class="info"><div class="name">${esc(s.productName)}</div><div class="meta">${meta}</div></div>
    <div class="amt">${money(s.sum)}</div><button class="del" data-delsale="${esc(s.id)}" aria-label="Удалить покупку">✕</button></div>`;
}
function vSales(){
  const k=dayKey(state.day);
  const ds=state.sales.filter(s=>s.date===k).sort((a,b)=>(b.ts||0)-(a.ts||0));const t=totals(ds);
  const groups={};ds.forEach(s=>{(groups[s.pointId||"_"]=groups[s.pointId||"_"]||[]).push(s)});
  const gk=Object.keys(groups).sort((a,b)=>totals(groups[b]).sum-totals(groups[a]).sum);
  return `<div class="view">
    <header><div><div class="eyebrow">Журнал продаж</div><h1>${esc(dayTitle(state.day))}</h1></div>
      <div class="daybar"><button class="iconbtn" id="prevDay" aria-label="Предыдущий день">‹</button>
      <button class="iconbtn" id="nextDay" aria-label="Следующий день" ${k>=today()?"disabled":""}>›</button></div></header>
    <div class="summary"><div class="stat"><b>${money(t.sum)}</b><span>выручка</span></div>
      <div class="stat alt"><b>${t.qty}</b><span>штук</span></div>
      <div class="stat alt"><b>${new Set(ds.map(s=>s.customerId)).size}</b><span>покупателей</span></div></div>
    ${ds.length?gk.map(g=>{const pt=state.points.find(p=>p.id===g);const nm=pt?pt.name:(groups[g][0].pointName||"Без точки");
      return `<div class="group"><h3><span>${esc(nm)}</span><span>${money(totals(groups[g]).sum)}</span></h3>
      <div class="list">${groups[g].map(s=>saleRow(s,true)).join("")}</div></div>`}).join("")
    :`<div class="empty"><strong>${k===today()?"Сегодня продаж пока нет":"В этот день продаж нет"}</strong>Откройте «Точки», выберите точку и покупателя.</div>`}
  </div>`;
}
function vProducts(){
  const cats=catNames();
  if(state.cat!=="all"&&!cats.includes(state.cat))state.cat="all";
  const prods=state.products.filter(p=>state.cat==="all"||p.category===state.cat).sort(byName);
  return `<div class="view">
    <header><div><div class="eyebrow">Каталог</div><h1>Товары</h1></div></header>
    ${cats.length?`<div class="chips" id="catChips">${chipHtml(cats,state.cat)}</div>`:""}
    ${prods.length?`<div class="grid">${prods.map(p=>`<button class="card" data-prod="${esc(p.id)}">${thumb(p,"ph")}
      <div class="cap"><div class="name">${esc(p.name)}</div><div class="cat">${esc(p.category||"Без категории")}</div>${p.price?`<div class="price">${money(p.price)}</div>`:""}</div></button>`).join("")}</div>`
    :`<div class="empty"><strong>Товаров пока нет</strong>Добавьте товар: фото, название, категорию и цену.</div>`}
    <button class="btn" id="addProduct">+ Новый товар</button>
    <p class="note">Вы вошли как ${esc(state.user.email||"")}</p>
    <button class="link" id="logout">Выйти из аккаунта</button>
  </div>`;
}
const catNames=()=>[...new Set(state.categories.map(c=>c.name).concat(state.products.map(p=>p.category).filter(Boolean)))].sort((a,b)=>a.localeCompare(b,"ru"));
const chipHtml=(cats,cur)=>[`<button class="chip" data-cat="all" aria-pressed="${cur==="all"}">Все</button>`]
  .concat(cats.map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${cur===c}">${esc(c)}</button>`)).join("");

function vLogin(){
  if(!sb)return `<div class="view" style="padding-top:40px"><header><div><div class="eyebrow">Настройка</div><h1>Приложение не подключено к базе</h1></div></header>
    <div class="empty">Откройте файл index.html и вставьте адрес проекта Supabase и ключ anon в строки SUPABASE_URL и SUPABASE_ANON_KEY. Подробно — в инструкции.</div></div>`;
  return `<div class="view" style="padding-top:40px">
    <header><div><div class="eyebrow">Учёт продаж</div><h1>Мои продажи</h1></div></header>
    <div class="field"><label for="le">Email</label><input class="input" id="le" type="email" autocomplete="username" inputmode="email"></div>
    <div class="field"><label for="lp">Пароль</label><input class="input" id="lp" type="password" autocomplete="current-password" placeholder="Не меньше 6 символов"></div>
    <button class="btn" id="login">Войти</button>
    <button class="btn ghost" id="signup">Создать аккаунт</button>
    <p class="note">Данные хранятся в облаке и доступны с любого телефона после входа.</p></div>`;
}
function render(){
  let html;
  document.querySelector(".tabbar").hidden=!state.user;
  if(!state.user){$("#view").innerHTML=state.loading&&sb?`<div class="empty" style="margin-top:40px">Загрузка…</div>`:vLogin();return}
  if(state.tab==="points")html=state.customerId?vCustomer():state.pointId?vPoint():vPoints();
  else if(state.tab==="sales")html=vSales();
  else html=vProducts();
  const y=window.scrollY;$("#view").innerHTML=html;window.scrollTo(0,y);
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===state.tab));
}
function go(fn){fn();window.scrollTo(0,0);render()}

/* ---------- sheets ---------- */
function openSheet(html){const s=$("#scrim");s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;s.hidden=false;return s.firstChild}
function closeSheet(){$("#scrim").hidden=true;$("#scrim").innerHTML=""}
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
async function busy(btn,label,fn){const old=btn.textContent;btn.disabled=true;btn.textContent=label;
  try{await fn()}catch(e){btn.disabled=false;btn.textContent=old;toast("Не удалось сохранить. Проверьте интернет и попробуйте ещё раз.")}}

function pointSheet(){
  const sh=openSheet(`<h2>Новая точка</h2>
    <div class="field"><label for="ptn">Название точки</label><input class="input" id="ptn" placeholder="Например, Рынок Корвон, ряд 5" autocomplete="off"></div>
    <div class="field"><label for="pta">Адрес или заметка (необязательно)</label><input class="input" id="pta" autocomplete="off"></div>
    <button class="btn" id="pts">Создать точку</button><button class="btn ghost" data-close>Отмена</button>`);
  sh.querySelector("#ptn").focus();
  sh.querySelector("#pts").onclick=e=>{const name=sh.querySelector("#ptn").value.trim();if(!name){toast("Введите название точки");return}
    busy(e.target,"Сохраняю…",async()=>{const id=await add("points",{name,address:sh.querySelector("#pta").value.trim(),createdAt:Date.now()});
      closeSheet();toast("Точка создана");go(()=>{state.pointId=id;state.customerId=null})})};
}
function customerSheet(){
  const p=state.points.find(x=>x.id===state.pointId);if(!p)return;
  const sh=openSheet(`<div class="eyebrow">${esc(p.name)}</div><h2>Новый покупатель</h2>
    <div class="field"><label for="cn">Имя</label><input class="input" id="cn" placeholder="Например, Фарход" autocomplete="off"></div>
    <div class="field"><label for="cp">Телефон (необязательно)</label><input class="input" id="cp" type="tel" inputmode="tel" autocomplete="off"></div>
    <button class="btn" id="cs">Добавить покупателя</button><button class="btn ghost" data-close>Отмена</button>`);
  sh.querySelector("#cn").focus();
  sh.querySelector("#cs").onclick=e=>{const name=sh.querySelector("#cn").value.trim();if(!name){toast("Введите имя покупателя");return}
    busy(e.target,"Сохраняю…",async()=>{const id=await add("customers",{pointId:p.id,name,phone:sh.querySelector("#cp").value.trim(),createdAt:Date.now()});
      closeSheet();toast("Покупатель добавлен");go(()=>{state.customerId=id})})};
}
function productSheet(){
  const cats=catNames();
  const sh=openSheet(`<h2>Новый товар</h2>
    <button type="button" class="photo-pick" id="pp"><span>📷 Добавить фото</span></button>
    <input type="file" id="pf" accept="image/*" hidden>
    <div class="field"><label for="pn">Название</label><input class="input" id="pn" placeholder="Например, Сахар 1 кг" autocomplete="off"></div>
    <div class="rowline">
      <div class="field"><label for="pc">Категория</label>
        <select class="input" id="pc">${cats.map(c=>`<option>${esc(c)}</option>`).join("")}<option value="__new">+ Новая…</option></select></div>
      <div class="field"><label for="pr">Цена, ${CUR}</label><input class="input mono" id="pr" inputmode="decimal" placeholder="0"></div>
    </div>
    <input class="input" id="pcn" placeholder="Название новой категории" ${cats.length?"hidden":""}>
    <button class="btn" id="ps">Сохранить товар</button><button class="btn ghost" data-close>Отмена</button>`);
  let photo=null;const sel=sh.querySelector("#pc"),nc=sh.querySelector("#pcn");
  if(!cats.length)sel.value="__new";
  sel.onchange=()=>{nc.hidden=sel.value!=="__new";if(!nc.hidden)nc.focus()};
  sh.querySelector("#pp").onclick=()=>sh.querySelector("#pf").click();
  sh.querySelector("#pf").onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{photo=await resize(f,480,.72);
      sh.querySelector("#pp").innerHTML=`<img src="${photo.dataUrl}" alt="Фото товара">`}catch(_){toast("Не удалось открыть фото. Попробуйте другое.")}};
  sh.querySelector("#ps").onclick=e=>{
    const name=sh.querySelector("#pn").value.trim();const cat=sel.value==="__new"?nc.value.trim():sel.value;
    const prRaw=sh.querySelector("#pr").value.trim();const price=prRaw?num(prRaw):0;
    if(!name){toast("Введите название товара");return}
    if(!cat){toast("Введите категорию");return}
    if(!(price>=0)){toast("Цена должна быть числом");return}
    busy(e.target,"Сохраняю…",async()=>{
      const data={name,category:cat,price,createdAt:Date.now()};
      if(photo)data.photoData=photo.dataUrl;
      if(!state.categories.some(c=>c.name===cat))await add("categories",{name:cat});
      await add("products",data);closeSheet();toast("Товар добавлен");state.cat=cat;render();
    })};
}
function productInfoSheet(p){
  const sh=openSheet(`<div class="prodhead">${thumb(p,"thumb")}<div style="min-width:0"><div class="eyebrow">${esc(p.category||"")}</div><h2>${esc(p.name)}</h2></div></div>
    <button type="button" class="photo-pick" id="epp">${photoSrc(p)?`<img src="${esc(photoSrc(p))}" alt="Фото товара">`:`<span>📷 Добавить фото</span>`}</button>
    <input type="file" id="epf" accept="image/*" hidden>
    <div class="field"><label for="ep">Цена, ${CUR}</label><input class="input mono" id="ep" inputmode="decimal" value="${p.price||""}" placeholder="0"></div>
    <button class="btn" id="es">Сохранить</button>
    <button class="link" id="ed">Удалить товар</button>`);
  let newPhoto=null;
  sh.querySelector("#epp").onclick=()=>sh.querySelector("#epf").click();
  sh.querySelector("#epf").onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{newPhoto=await resize(f,480,.72);sh.querySelector("#epp").innerHTML=`<img src="${newPhoto.dataUrl}" alt="Фото товара">`}catch(_){toast("Не удалось открыть фото. Попробуйте другое.")}};
  sh.querySelector("#es").onclick=e=>{const v=sh.querySelector("#ep").value.trim();const price=v?num(v):0;
    if(!(price>=0)){toast("Цена должна быть числом");return}
    busy(e.target,"Сохраняю…",async()=>{const d={price};if(newPhoto)d.photoData=newPhoto.dataUrl;await patch("products",p.id,d);closeSheet();toast("Сохранено")})};
  sh.querySelector("#ed").onclick=e=>armDelete(e.target,"Нажмите ещё раз, чтобы удалить",async()=>{
    try{await remove("products",p.id);closeSheet();toast("Товар удалён")}catch(_){toast("Не удалось удалить")}});
}
function pickProductSheet(c){
  let cat="all",q="";const cats=catNames();
  const sh=openSheet(`<div class="eyebrow">Покупка · ${esc(c.name)}</div><h2>Что взял?</h2>
    <input class="input" id="pq" placeholder="Поиск товара" autocomplete="off">
    ${cats.length?`<div class="chips" id="pkc"></div>`:""}
    <div class="pick" id="pkl"></div>
    <button class="btn ghost" data-close>Отмена</button>`);
  const draw=()=>{
    if(cats.length)sh.querySelector("#pkc").innerHTML=chipHtml(cats,cat);
    const list=state.products.filter(p=>(cat==="all"||p.category===cat)&&(!q||p.name.toLowerCase().includes(q))).sort(byName);
    sh.querySelector("#pkl").innerHTML=list.length?list.map(p=>`<button class="row" data-pick="${esc(p.id)}">${thumb(p,"thumb")}
      <div class="info"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.category||"")}</div></div><div class="amt">${p.price?money(p.price):""}</div></button>`).join("")
      :`<div class="empty" style="border:0">${state.products.length?"Ничего не найдено":"Товаров пока нет. Добавьте их во вкладке «Товары»."}</div>`;
  };
  draw();
  sh.querySelector("#pq").oninput=e=>{q=e.target.value.trim().toLowerCase();draw()};
  sh.addEventListener("click",e=>{const ch=e.target.closest("[data-cat]");if(ch){cat=ch.dataset.cat;draw();return}
    const pk=e.target.closest("[data-pick]");if(pk){const p=state.products.find(x=>x.id===pk.dataset.pick);if(p)saleSheet(p,c)}});
}
function saleSheet(p,c){
  const pt=state.points.find(x=>x.id===c.pointId)||{name:""};
  const sh=openSheet(`<div class="prodhead">${thumb(p,"thumb")}<div style="min-width:0"><div class="eyebrow">${esc(c.name)} · ${esc(pt.name)}</div><h2>${esc(p.name)}</h2></div></div>
    <div class="field"><label for="sq">Количество</label>
      <div class="stepper"><button type="button" id="sm" aria-label="Меньше">−</button><input id="sq" inputmode="decimal" value="1"><button type="button" id="sp" aria-label="Больше">+</button></div></div>
    <div class="rowline">
      <div class="field"><label for="spr">Цена за штуку</label><input class="input mono" id="spr" inputmode="decimal" value="${p.price||""}" placeholder="0"></div>
      <div class="field"><label for="ssum">Сумма, ${CUR}</label><input class="input mono" id="ssum" inputmode="decimal" placeholder="0"></div>
    </div>
    <div class="field"><label for="sc">Комментарий</label><textarea class="input" id="sc" placeholder="Например: долг до пятницы"></textarea></div>
    <div class="total"><span>Итого</span><b id="stot">0 ${CUR}</b></div>
    <button class="btn" id="ss">Записать на сегодня</button>
    <button class="btn ghost" id="sback">‹ Другой товар</button>`);
  const q=sh.querySelector("#sq"),pr=sh.querySelector("#spr"),sm=sh.querySelector("#ssum");let sumTouched=false;
  const upd=()=>{if(!sumTouched){const v=num(q.value)*num(pr.value);sm.value=isFinite(v)&&v>0?Math.round(v*100)/100:""}
    sh.querySelector("#stot").textContent=money(num(sm.value)||0)};
  upd();
  sh.querySelector("#sm").onclick=()=>{q.value=Math.max(1,(num(q.value)||1)-1);sumTouched=false;upd()};
  sh.querySelector("#sp").onclick=()=>{q.value=(num(q.value)||0)+1;sumTouched=false;upd()};
  q.oninput=()=>{sumTouched=false;upd()};pr.oninput=()=>{sumTouched=false;upd()};
  sm.oninput=()=>{sumTouched=true;upd()};
  sh.querySelector("#sback").onclick=()=>pickProductSheet(c);
  sh.querySelector("#ss").onclick=e=>{
    const qty=num(q.value),sum=num(sm.value),price=num(pr.value)||0;
    if(!(qty>0)){toast("Укажите количество больше нуля");return}
    if(!(sum>=0)){toast("Укажите сумму");return}
    busy(e.target,"Сохраняю…",async()=>{
      await add("sales",{date:today(),ts:Date.now(),pointId:pt.id||c.pointId,pointName:pt.name,customerId:c.id,customerName:c.name,
        productId:p.id,productName:p.name,category:p.category||"",qty,price,sum,comment:sh.querySelector("#sc").value.trim()});
      closeSheet();toast("Записано: "+p.name+" ×"+qty+" = "+money(sum));
    })};
}

/* ---------- events ---------- */
document.querySelector(".tabbar").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;
  go(()=>{if(b.dataset.tab==="points"&&state.tab==="points"){state.pointId=null;state.customerId=null}state.tab=b.dataset.tab;if(state.tab==="sales")state.day=new Date()})});
$("#scrim").addEventListener("click",e=>{if(e.target.closest("[data-close]"))closeSheet()});
$("#view").addEventListener("click",e=>{
  const t=e.target;let b;
  if(b=t.closest("[data-point]"))return go(()=>{state.pointId=b.dataset.point;state.customerId=null});
  if(b=t.closest("[data-customer]"))return go(()=>{state.customerId=b.dataset.customer});
  if(b=t.closest("[data-go]"))return go(()=>{if(b.dataset.go==="points"){state.pointId=null;state.customerId=null}else state.customerId=null});
  if(b=t.closest("[data-delsale]"))return armDelete(b,"Удалить?",()=>remove("sales",b.dataset.delsale).catch(()=>toast("Не удалось удалить")));
  if(b=t.closest("[data-prod]")){const p=state.products.find(x=>x.id===b.dataset.prod);if(p)productInfoSheet(p);return}
  if(b=t.closest("[data-cat]")){state.cat=b.dataset.cat;render();return}
  switch(t.id){
    case "login":case "signup":return auth(t.id,t);
    case "logout":return armDelete(t,"Нажмите ещё раз, чтобы выйти",()=>sb.auth.signOut());
    case "addPoint":return pointSheet();
    case "addCustomer":return customerSheet();
    case "addProduct":return productSheet();
    case "addSale":{const c=state.customers.find(x=>x.id===state.customerId);if(c)pickProductSheet(c);return}
    case "prevDay":state.day=new Date(state.day.getTime()-864e5);return render();
    case "nextDay":{const n=new Date(state.day.getTime()+864e5);if(dayKey(n)<=today()){state.day=n;render()}return}
    case "delPoint":return armDelete(t,"Нажмите ещё раз — точка и её покупатели удалятся",async()=>{
      const id=state.pointId;try{for(const c of state.customers.filter(c=>c.pointId===id))await remove("customers",c.id);
        await remove("points",id);go(()=>{state.pointId=null});toast("Точка удалена")}catch(_){toast("Не удалось удалить")}});
    case "delCustomer":return armDelete(t,"Нажмите ещё раз, чтобы удалить",async()=>{
      try{await remove("customers",state.customerId);go(()=>{state.customerId=null});toast("Покупатель удалён")}catch(_){toast("Не удалось удалить")}});
  }
});

/* ---------- auth & boot ---------- */
async function auth(kind,btn){
  const email=$("#le").value.trim(),password=$("#lp").value;
  if(!email||password.length<6){toast("Введите email и пароль не короче 6 символов");return}
  btn.disabled=true;
  try{
    const r=kind==="signup"?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
    if(r.error)throw r.error;
    if(kind==="signup"&&!r.data.session){toast("Аккаунт создан. Подтвердите email по ссылке из письма и войдите.");btn.disabled=false;return}
  }catch(e){btn.disabled=false;
    const m=String(e&&e.message||"");
    toast(/Invalid login/i.test(m)?"Неверный email или пароль":/registered/i.test(m)?"Такой email уже зарегистрирован — нажмите «Войти»":/confirm/i.test(m)?"Сначала подтвердите email по ссылке из письма":"Ошибка: "+m)}
}
async function onSession(session){
  state.user=session?session.user:null;state.loading=false;
  if(!state.user){COLS.forEach(c=>state[c]=[]);state.pointId=state.customerId=null;state.tab="points";render();return}
  render();
  try{await loadAll()}catch(e){toast("Не удалось загрузить данные. Проверьте интернет.")}
}
render();
if(sb){
  sb.auth.getSession().then(({data})=>onSession(data.session));
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==="SIGNED_IN"&&!state.user)onSession(session);if(ev==="SIGNED_OUT")onSession(null)});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&state.user)loadAll().catch(()=>{})});
}else{state.loading=false;render()}
})();
</script>
</body>
</html>
